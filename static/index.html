<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Snake Game - Go Edition</title>
<style>
    body {
        background: #1a1a2e;
        display: flex;
        flex-direction: column;
        align-items: center;
        font-family: Arial, sans-serif;
        color: white;
        margin-top: 30px;
    }
    h1 { color: #4ade80; }
    canvas {
        background: #0f0f1e;
        border: 3px solid #4ade80;
        border-radius: 8px;
    }
    canvas { max-width: 92vw; height: auto; touch-action: none; }
    .mobile-controls {
        display: none;               /* disembunyikan di desktop */
        flex-direction: column;
        align-items: center;
        gap: 14px;
        margin-top: 16px;
        user-select: none;
        -webkit-user-select: none;
        -webkit-touch-callout: none;
    }
    /* Tampil hanya di perangkat layar sentuh (HP/tablet) */
    @media (hover: none) and (pointer: coarse) {
        .mobile-controls { display: flex; }
    }
    .dpad {
        display: grid;
        grid-template-columns: repeat(3, 72px);
        grid-template-rows: repeat(2, 72px);
        grid-template-areas: ". up ." "left down right";
        gap: 8px;
    }
    .dpad button, .extra button {
        background: #16213e;
        color: #4ade80;
        border: 2px solid #4ade80;
        border-radius: 12px;
        font-size: 28px;
        touch-action: manipulation;
    }
    .dpad button:active, .extra button:active { background: #4ade80; color: #0f0f1e; }
    .extra { display: flex; gap: 12px; }
    .extra button { font-size: 16px; padding: 12px 20px; }
    #btn-up { grid-area: up; } #btn-down { grid-area: down; }
    #btn-left { grid-area: left; } #btn-right { grid-area: right; }
    #score {
        font-size: 22px;
        margin-bottom: 10px;
    }
    #status {
        margin-top: 10px;
        font-size: 16px;
        color: #aaa;
    }
    #leaderboard {
        margin-top: 25px;
        background: #16213e;
        padding: 15px 25px;
        border-radius: 8px;
        min-width: 250px;
    }
    #leaderboard h2 {
        margin-top: 0;
        font-size: 18px;
        color: #4ade80;
        text-align: center;
    }
    #leaderboard-list {
        padding-left: 20px;
        margin: 0;
    }
    #leaderboard-list li {
        padding: 3px 0;
    }
</style>
</head>
<body>

<h1>🐍 Snake Game</h1>
<div id="score">Skor: 0</div>
<canvas id="gameCanvas" width="400" height="400"></canvas>
<div id="status"></div>

<div class="mobile-controls">
    <div class="dpad">
        <button id="btn-up" aria-label="Atas">▲</button>
        <button id="btn-left" aria-label="Kiri">◀</button>
        <button id="btn-down" aria-label="Bawah">▼</button>
        <button id="btn-right" aria-label="Kanan">▶</button>
    </div>
    <div class="extra">
        <button id="btn-pause">⏸ Jeda</button>
        <button id="btn-restart">🔄 Main Lagi</button>
    </div>
</div>

<div id="leaderboard">
    <h2>🏆 Leaderboard</h2>
    <ol id="leaderboard-list"><li>Memuat...</li></ol>
</div>

<script>
// ==== KONFIGURASI ====
const canvas = document.getElementById("gameCanvas");
const ctx = canvas.getContext("2d");
const isTouch = window.matchMedia("(hover: none) and (pointer: coarse)").matches;
const START_HINT = isTouch
    ? "Tekan tombol panah di bawah untuk mulai bergerak."
    : "Tekan tombol panah / WASD untuk mulai gerak. Tekan Spasi untuk restart.";
const box = 20; // ukuran satu kotak grid
const gridSize = canvas.width / box; // 20x20 grid

// ==== STATE GAME ====
let snake = [{ x: 10, y: 10 }]; // mulai di tengah
let direction = null;
let nextDirection = null;
let food = randomFoodPosition();
let score = 0;
let gameOver = false;
let speed = 150; // ms per langkah, makin kecil makin cepat
let paused = false;
let highScore = Number(localStorage.getItem("snakeHighScore")) || 0;
const BASE_SPEED = 150, MIN_SPEED = 60;

function randomFoodPosition() {
    let pos;
    do {
        pos = {
            x: Math.floor(Math.random() * gridSize),
            y: Math.floor(Math.random() * gridSize)
        };
    } while (snake.some(s => s.x === pos.x && s.y === pos.y)); // ulangi jika kena ular
    return pos;
}

// ==== INPUT KEYBOARD ====
document.addEventListener("keydown", (e) => {
    const key = e.key.toLowerCase();

    if (["arrowup", "arrowdown", "arrowleft", "arrowright", " "].includes(key)) {
        e.preventDefault(); // cegah halaman ikut scroll
    }
    if (key === "p") {
        togglePause();
        return;
    }

    if (gameOver && key === " ") {
        restartGame();
        return;
    }

    if (key === "arrowup" || key === "w") changeDirection("up");
    else if (key === "arrowdown" || key === "s") changeDirection("down");
    else if (key === "arrowleft" || key === "a") changeDirection("left");
    else if (key === "arrowright" || key === "d") changeDirection("right");
});

// Ganti arah, tapi tidak boleh langsung berbalik 180 derajat
const opposite = { up: "down", down: "up", left: "right", right: "left" };
function changeDirection(dir) {
    if (direction !== opposite[dir]) nextDirection = dir;
}

function togglePause() {
    if (gameOver || !direction) return;
    paused = !paused;
    document.getElementById("status").innerText = paused
        ? (isTouch ? "Dijeda. Ketuk Jeda untuk lanjut." : "Dijeda. Tekan P untuk lanjut.")
        : "";
    draw();
}

// ==== TOMBOL LAYAR SENTUH ====
// pointerdown = bereaksi saat jari menyentuh layar (lebih cepat dari click)
[["btn-up", "up"], ["btn-down", "down"], ["btn-left", "left"], ["btn-right", "right"]]
    .forEach(([id, dir]) => {
        document.getElementById(id).addEventListener("pointerdown", (e) => {
            e.preventDefault();
            changeDirection(dir);
        });
    });
document.getElementById("btn-pause").addEventListener("click", togglePause);
document.getElementById("btn-restart").addEventListener("click", restartGame);

// ==== LOGIKA UTAMA GAME ====
function update() {
    if (gameOver) return;
    if (nextDirection) direction = nextDirection;
    if (!direction) return; // belum mulai gerak

    const head = { ...snake[0] };

    if (direction === "up") head.y -= 1;
    else if (direction === "down") head.y += 1;
    else if (direction === "left") head.x -= 1;
    else if (direction === "right") head.x += 1;

    // Cek nabrak dinding
    if (head.x < 0 || head.x >= gridSize || head.y < 0 || head.y >= gridSize) {
        return endGame();
    }

    // Cek nabrak badan sendiri
    for (const segment of snake) {
        if (segment.x === head.x && segment.y === head.y) {
            return endGame();
        }
    }

    snake.unshift(head); // tambah kepala baru di depan

    // Cek makan makanan
    if (head.x === food.x && head.y === food.y) {
        score += 10;
        updateScoreText();
        food = randomFoodPosition();
        speed = Math.max(MIN_SPEED, BASE_SPEED - Math.floor(score / 50) * 10); // makin cepat tiap 50 poin
        if (score > highScore) {
            highScore = score;
            localStorage.setItem("snakeHighScore", highScore);
            updateScoreText();
        }
    } else {
        snake.pop(); // buang ekor kalau tidak makan (biar panjang tetap)
    }
}

function updateScoreText() {
    document.getElementById("score").innerText = "Skor: " + score + "  |  Terbaik: " + highScore;
}

function draw() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    // Gambar makanan
    ctx.fillStyle = "#f87171";
    ctx.fillRect(food.x * box, food.y * box, box - 1, box - 1);

    // Gambar ular
    snake.forEach((segment, index) => {
        ctx.fillStyle = index === 0 ? "#4ade80" : "#22c55e";
        ctx.fillRect(segment.x * box, segment.y * box, box - 1, box - 1);
    });

    if (paused) {
        ctx.fillStyle = "rgba(0,0,0,0.5)";
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.fillStyle = "white";
        ctx.font = "24px Arial";
        ctx.textAlign = "center";
        ctx.fillText("Dijeda", canvas.width / 2, canvas.height / 2);
    }

    if (gameOver) {
        ctx.fillStyle = "rgba(0,0,0,0.6)";
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.fillStyle = "white";
        ctx.font = "24px Arial";
        ctx.textAlign = "center";
        ctx.fillText("Game Over!", canvas.width / 2, canvas.height / 2 - 10);
        ctx.font = "16px Arial";
        ctx.fillText(isTouch ? "Ketuk Main Lagi di bawah" : "Tekan Spasi untuk main lagi", canvas.width / 2, canvas.height / 2 + 20);
    }
}

function endGame() {
    gameOver = true;
    document.getElementById("status").innerText = "Game selesai dengan skor " + score;
    draw(); // tampilkan layar Game Over sebelum prompt muncul
    if (score === 0) return; // skor 0 tidak perlu masuk leaderboard

    // setTimeout memberi browser waktu menggambar layar Game Over dulu
    setTimeout(() => {
        const name = prompt("Game Over! Masukkan nama kamu untuk leaderboard:", "Player");
        if (name === null) return; // tekan Batal = jangan simpan
        submitScore(name.trim().slice(0, 20) || "Anonim", score);
    }, 50);
}

// ==== LEADERBOARD (Fetch API ke server Go) ====

async function submitScore(playerName, finalScore) {
    try {
        const res = await fetch("/api/score", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ player_name: playerName, score: finalScore })
        });
        if (!res.ok) console.error("Server menolak skor:", await res.text());
    } catch (err) {
        console.error("Gagal simpan skor:", err);
    }
    loadLeaderboard(); // refresh tampilan setelah skor tersimpan
}

async function loadLeaderboard() {
    const list = document.getElementById("leaderboard-list");
    try {
        const res = await fetch("/api/leaderboard");
        const data = await res.json();

        list.innerHTML = ""; // kosongkan dulu

        if (!data || data.length === 0) {
            list.innerHTML = "<li>Belum ada skor.</li>";
            return;
        }

        data.forEach((entry) => {
            const li = document.createElement("li");
            li.textContent = entry.player_name + " — " + entry.score;
            list.appendChild(li);
        });
    } catch (err) {
        console.error("Gagal ambil leaderboard:", err);
        list.innerHTML = "<li>Gagal memuat leaderboard.</li>";
    }
}

function restartGame() {
    snake = [{ x: 10, y: 10 }];
    direction = null;
    nextDirection = null;
    food = randomFoodPosition();
    score = 0;
    gameOver = false;
    paused = false;
    speed = BASE_SPEED;
    updateScoreText();
    document.getElementById("status").innerText = START_HINT;
}

// ==== GAME LOOP ====
function tick() {
    if (!paused) {
        update();
        draw();
    }
    setTimeout(tick, speed); // jadwalkan langkah berikutnya dengan speed terbaru
}

document.getElementById("status").innerText = START_HINT;
updateScoreText();
tick();
loadLeaderboard(); // tampilkan leaderboard begitu halaman dibuka
</script>

</body>
</html>
